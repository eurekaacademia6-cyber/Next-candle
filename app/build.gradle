plugins { id 'com.android.application' }
android {
    namespace 'com.nextcandle.ai'
    compileSdk 36
    defaultConfig { applicationId 'com.nextcandle.ai'; minSdk 24; targetSdk 36; versionCode 1; versionName '1.0' }
    buildTypes { release { minifyEnabled false; shrinkResources false } debug { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.camera:camera-core:1.6.1'
    implementation 'androidx.camera:camera-camera2:1.6.1'
    implementation 'androidx.camera:camera-lifecycle:1.6.1'
    implementation 'androidx.camera:camera-view:1.6.1'
    implementation 'androidx.camera:camera-video:1.6.1'
}
