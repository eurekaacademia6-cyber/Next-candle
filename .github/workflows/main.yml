name: Build Next Candle AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Show Java version
        run: |
          java -version

      - name: Show Gradle version
        run: |
          gradle --version

      - name: Verify Android project structure
        run: |
          echo "=== Repository root ==="
          ls -la

          echo ""
          echo "=== App module ==="
          ls -la app

          echo ""
          echo "=== Gradle files ==="
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f app/build.gradle

          echo ""
          echo "=== Android source tree ==="
          find app/src -maxdepth 5 -type f | sort

      - name: Clean build
        run: |
          gradle clean --stacktrace

      - name: Build debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Locate APK
        run: |
          echo "=== Generated APKs ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Verify APK exists
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NextCandleAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
